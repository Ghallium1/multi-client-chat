# Network settings for TCPServer, read at runtime.
#
# To change them without recompiling, put a copy of this file next to TCPServer.jar
# (in the working directory) or start with -Dchat.config=path/to/server.properties.

# Address to listen on. 0.0.0.0 accepts connections on every network interface (LAN included);
# use 127.0.0.1 to accept local connections only.
server.ip=0.0.0.0
server.port=3000
