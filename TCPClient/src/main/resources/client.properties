# Default server for TCPClient, used only when it is started WITHOUT arguments.
# Command-line arguments always win:  java -jar TCPClient.jar <ServerIPAddress> <PortNumber>
#
# To change these without recompiling, put a copy of this file next to TCPClient.jar
# (in the working directory) or start with -Dchat.config=path/to/client.properties.

server.ip=localhost
server.port=3000
